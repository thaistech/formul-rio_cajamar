<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diagnóstico CD Cajamar — Registro em Campo</title>
<style>
:root {
  --navy:#173A5E;
  --blue:#2F6B9A;
  --blue2:#4C84B5;
  --yellow:#F4C542;
  --yellow-soft:#FFF8D8;
  --gray:#E9EDF2;
  --gray2:#F7F8FA;
  --text:#1F2937;
  --muted:#667085;
  --white:#fff;
  --green:#2E7D32;
  --red:#B42318;
  --shadow:0 8px 24px rgba(23,58,94,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#F4F6F8;color:var(--text)}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.sidebar{background:var(--navy);color:white;padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:22px;font-weight:800;line-height:1.1;margin-bottom:6px}
.subbrand{font-size:12px;opacity:.78;margin-bottom:24px}
.progress-wrap{background:rgba(255,255,255,.1);border-radius:14px;padding:14px;margin-bottom:18px}
.progress-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
.progress{height:8px;background:rgba(255,255,255,.16);border-radius:999px;overflow:hidden}
.progress > div{height:100%;width:0;background:var(--yellow);transition:.25s}
.navbtn{width:100%;border:0;background:transparent;color:#EAF2F8;text-align:left;padding:11px 12px;border-radius:10px;margin:3px 0;cursor:pointer;font-size:13px}
.navbtn:hover,.navbtn.active{background:rgba(255,255,255,.12);color:#fff}
.navbtn small{display:block;opacity:.7;margin-top:3px}
.content{padding:28px 34px 60px;max-width:1200px;width:100%;margin:0 auto}
.topbar{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
.title h1{margin:0;font-size:28px;color:var(--navy)} .title p{margin:6px 0 0;color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button.action{border:1px solid #CBD5E1;background:white;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700;color:var(--navy)}
button.primary{background:var(--yellow);border-color:var(--yellow);color:#3C2F00}
.topic{display:none} .topic.active{display:block}
.topic-head{background:white;border-left:5px solid var(--yellow);padding:18px 20px;border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px}
.topic-head h2{margin:0;color:var(--navy);font-size:21px}
.topic-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.card{background:white;border:1px solid #E2E8F0;border-radius:15px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card-head{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:start;padding:17px 18px;cursor:pointer}
.idpill{background:var(--navy);color:white;font-weight:800;border-radius:10px;text-align:center;padding:8px 5px;font-size:13px}
.card-title{font-weight:800;font-size:15px;line-height:1.35;color:#243447}
.status-dot{width:10px;height:10px;border-radius:50%;background:#CBD5E1;margin-top:6px}
.card-body{display:none;border-top:1px solid #EEF2F6;padding:18px}
.card.open .card-body{display:block}
.guide{background:var(--yellow-soft);border:1px solid #F2DE87;border-radius:12px;padding:14px;margin-bottom:16px}
.guide b{color:#5F4A00} .guide p{margin:6px 0 0;line-height:1.5;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:12px;font-weight:800;color:#475467}
input,select,textarea{width:100%;border:1px solid #CBD5E1;border-radius:9px;padding:10px 11px;font:inherit;background:white}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(47,107,154,.15);border-color:var(--blue)}
.item-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;color:var(--muted)}
.saved{color:var(--green);font-weight:700}
.note{font-size:12px;color:var(--muted);background:var(--gray2);padding:10px 12px;border-radius:9px;margin-top:12px}
@media (max-width:900px) {
 .app{grid-template-columns:1fr}
 .sidebar{position:relative;height:auto}
 .content{padding:20px 14px 50px}
 .grid{grid-template-columns:1fr}
 .topbar{flex-direction:column}
}
@media print {
 .sidebar,.actions{display:none}
 .app{display:block}
 .content{max-width:none;padding:0}
 .topic{display:block!important}
 .card-body{display:block!important}
 .card{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Diagnóstico CD Cajamar</div>
    <div class="subbrand">Registro em Campo • Protótipo HTML</div>
    <div class="progress-wrap">
      <div class="progress-head"><span>Progresso</span><strong id="progText">0/49</strong></div>
      <div class="progress"><div id="progBar"></div></div>
    </div>
    <div id="nav"></div>
  </aside>

  <main class="content">
    <div class="topbar">
      <div class="title">
        <h1>Formulário de coleta em campo</h1>
        <p>Abra um requisito, consulte o que deve ser registrado e anote a evidência da visita.</p>
      </div>
      <div class="actions">
        <button class="action" onclick="window.print()">Imprimir / PDF</button>
        <button class="action" onclick="exportarJSON()">Exportar coleta</button>
        <button class="action primary" onclick="salvarTudo()">Salvar agora</button>
      </div>
    </div>
    <div id="topics"></div>
  </main>
</div>

<script>
const DATA = [{"topic": "1. Mapeamento dos processos operacionais", "items": [["1.1", "Levantar todos os processos do Centro de Distribuição.", "Nome dos processos existentes; área onde ocorrem; início e fim de cada processo; responsável/área responsável; processos adicionais encontrados durante a visita."], ["1.2", "Identificar as etapas de recebimento, armazenagem, abastecimento, picking, separação, conferência e expedição.", "Como cada etapa acontece na prática; sequência das atividades; quem executa; onde ocorre; entradas e saídas percebidas; diferenças entre o processo informado e o observado."], ["1.3", "Verificar os fluxos físicos, sistêmicos e de informação.", "Caminho físico dos materiais; sistemas utilizados em cada etapa; como a informação chega e segue para a próxima etapa; registros manuais; interrupções ou desvios percebidos."], ["1.4", "Identificar interfaces e responsabilidades entre as áreas.", "Área que entrega; área que recebe; responsável pela atividade; ponto de passagem entre áreas; dúvidas ou sobreposição de responsabilidade; situações sem responsável claramente definido."]]}, {"topic": "2. Análise do fluxo de valor", "items": [["2.1", "Elaborar o VSM do estado atual.", "Sequência real do fluxo; processos envolvidos; entradas e saídas; volumes disponíveis; estoques intermediários observados; tempos que puderem ser coletados; sistemas envolvidos; informações necessárias que ficaram pendentes. O desenho final do VSM pode ser feito depois."], ["2.2", "Levantar tempos de processamento, espera, movimentação e estoque.", "Processo observado; horário de início/fim; tempo de processamento; tempo parado/espera; quantidade de movimentações; quantidade ou volume em fila/estoque; número de observações realizadas."], ["2.3", "Identificar gargalos, desperdícios e atividades que não agregam valor.", "Onde ocorreu; processo; descrição da situação; tipo de ocorrência percebida; frequência observada/relatada; impacto aparente; foto ou evidência, quando permitida."], ["2.4", "Desenvolver o VSD ou desenho do estado futuro.", "Registrar problemas do estado atual, restrições, sugestões das equipes, condições necessárias e oportunidades percebidas para alimentar o VSD posteriormente. O estado futuro não precisa ser desenhado durante a visita."], ["2.5", "Apontar oportunidades de melhoria no fluxo operacional.", "Processo; problema relacionado; oportunidade percebida; sugestão apresentada pela equipe, se houver; benefício esperado qualitativamente; observações para avaliação posterior."]]}, {"topic": "3. Avaliação da operação Lean Warehouse", "items": [["3.1", "Avaliar o layout e os deslocamentos internos.", "Área; origem e destino dos deslocamentos; percursos observados; retornos; cruzamentos; distâncias aparentemente excessivas; obstáculos; pontos de congestionamento; foto/planta, quando disponível."], ["3.2", "Verificar organização, endereçamento e identificação dos materiais.", "Área/endereço; condição da organização; material identificado ou não; endereço visível; etiqueta legível; situações fora do padrão; exemplos encontrados."], ["3.3", "Analisar os processos de picking e armazenagem aérea.", "Como o picking ocorre; forma de direcionamento; sequência utilizada; acesso aos produtos; reposição; dificuldades observadas; funcionamento da armazenagem aérea; situações de espera ou retorno."], ["3.4", "Identificar movimentações desnecessárias, esperas, retrabalhos e excesso de estoque.", "Registrar cada ocorrência separadamente: processo, local, descrição, causa aparente, frequência percebida e evidência."], ["3.5", "Avaliar oportunidades para redesenhar os processos com base no Lean Warehouse.", "Situação atual observada; ponto de melhoria; restrições físicas/operacionais; ideias mencionadas pelos operadores/lideranças; oportunidade a ser analisada posteriormente."]]}, {"topic": "4. Avaliação da acuracidade dos estoques", "items": [["4.1", "Verificar a acuracidade do picking e do estoque aéreo.", "SKU/material amostrado; endereço; quantidade física; quantidade apresentada no sistema disponível; divergência encontrada; área — picking ou aéreo; data/hora da verificação."], ["4.2", "Comparar o estoque físico com o estoque sistêmico.", "SKU; descrição; endereço; quantidade física; quantidade WMS; quantidade SAP, se disponível; diferença; observação."], ["4.3", "Avaliar as divergências entre SAP e WMS.", "Exemplos apresentados durante a visita; SKU/documento/transação; valor ou quantidade no SAP; valor ou quantidade no WMS; diferença; relato do responsável; evidência a solicitar para análise posterior."], ["4.4", "Identificar estoques virtuais sem tratativa.", "Exemplos mostrados no sistema; SKU/endereço; saldo virtual; situação física percebida; tempo da pendência, se informado; responsável/tratativa existente; pendências para aprofundamento."], ["4.5", "Verificar divergências cadastrais, especialmente códigos EAN.", "SKU/material amostrado; EAN físico; EAN apresentado no cadastro/sistema; divergência; tipo de erro encontrado; quantidade de amostras verificadas."], ["4.6", "Avaliar falhas de endereçamento e etiquetagem.", "Endereço; SKU; problema de endereçamento; etiqueta ausente, ilegível ou incorreta; situação encontrada; evidência/foto quando permitida."], ["4.7", "Analisar a gestão dos inventários cíclicos.", "Como o inventário é realizado; frequência informada; responsáveis; tratamento das divergências; controles utilizados; documentos/relatórios apresentados; problemas relatados."]]}, {"topic": "5. Avaliação dos sistemas e da infraestrutura", "items": [["5.1", "Verificar a integração e a consistência das informações entre SAP e WMS.", "Fluxo apresentado pelo usuário; onde a informação nasce; quando passa para o outro sistema; exemplos de inconsistência; telas ou transações apresentadas; responsável pelo processo; dados a solicitar depois."], ["5.2", "Avaliar a disponibilidade dos coletores de dados.", "Quantidade informada/disponível; quantidade operacional no momento; equipamentos indisponíveis; motivo conhecido; compartilhamento entre operadores; dificuldades relatadas."], ["5.3", "Identificar falhas de conexão e oscilações da infraestrutura de rede.", "Área onde ocorre; momento da ocorrência; equipamento afetado; frequência relatada; duração aproximada; atividade interrompida; evidência disponível."], ["5.4", "Verificar como as indisponibilidades tecnológicas impactam a produtividade e a acuracidade.", "Processo impactado; tipo de indisponibilidade; tempo parado observado/relatado; quantidade de pessoas afetadas; alternativa manual utilizada; retrabalho ou risco de erro causado."]]}, {"topic": "6. Avaliação da padronização operacional", "items": [["6.1", "Verificar a existência e a aplicação dos Procedimentos Operacionais Padrão, os POPs.", "Processo; POP existe ou não; onde está disponível; versão/data, quando visível; colaborador conhece; procedimento observado corresponde ou não ao POP; diferenças encontradas."], ["6.2", "Avaliar se as equipes executam as atividades de maneira padronizada.", "Processo observado; colaboradores/turnos observados; diferenças de sequência, método ou decisão; prática comum; exceções encontradas."], ["6.3", "Identificar processos dependentes do conhecimento individual dos colaboradores.", "Processo; atividade; pessoa ou função da qual depende; conhecimento que não está documentado; impacto de ausência/substituição; relato da equipe."], ["6.4", "Verificar a necessidade de criação, revisão ou atualização dos procedimentos.", "Processo sem procedimento; procedimento desatualizado; diferença entre POP e prática; informação ausente; observação para revisão posterior."]]}, {"topic": "7. Avaliação das equipes", "items": [["7.1", "Analisar o nível de maturidade operacional das equipes.", "Autonomia percebida; domínio da rotina; reação diante de problemas; necessidade de intervenção da liderança; conhecimento do fluxo; consistência entre pessoas."], ["7.2", "Verificar o conhecimento dos colaboradores sobre os processos.", "Processo; função entrevistada; entendimento sobre atividade, sequência, responsabilidade, exceções e problemas; dúvidas ou diferenças entre respostas."], ["7.3", "Avaliar as necessidades de capacitação e treinamento.", "Processo/tema em que foi percebida dificuldade; público relacionado; lacuna encontrada; treinamento existente, se informado; necessidade de reforço."], ["7.4", "Identificar oportunidades de desenvolvimento da liderança operacional.", "Como a liderança acompanha a operação; como orienta equipe; como trata desvios; frequência de acompanhamento; dificuldades relatadas; oportunidades percebidas."], ["7.5", "Verificar o nível de envolvimento das equipes com a melhoria contínua.", "Se colaboradores identificam problemas; se apresentam sugestões; se participam de melhorias; exemplos relatados; existência de canais ou rotinas para sugestões."]]}, {"topic": "8. Avaliação dos controles e indicadores", "items": [["8.1", "Levantar os indicadores de desempenho existentes.", "Nome do indicador; objetivo; área; responsável; meta; resultado atual visível; fonte do dado; periodicidade de atualização; onde é apresentado."], ["8.2", "Avaliar a confiabilidade e a frequência de atualização dos dados.", "Quem atualiza; frequência informada; origem dos dados; processo manual ou automático; atrasos conhecidos; divergências relatadas; evidências para checagem posterior."], ["8.3", "Verificar se existem indicadores de produtividade, qualidade, acuracidade, retrabalho, custos e nível de serviço.", "Para cada categoria: indicador existe ou não; nome utilizado; fonte; responsável; periodicidade; meta disponível."], ["8.4", "Identificar a necessidade de implantação ou revisão dos KPIs.", "Lacunas percebidas; processos sem indicador; indicadores que não refletem a operação; reclamações dos usuários; necessidade a ser analisada posteriormente."], ["8.5", "Avaliar os controles operacionais e os mecanismos de auditoria.", "Controle utilizado; onde é realizado; responsável; frequência; evidência gerada; como desvios são registrados e tratados; auditorias existentes."]]}, {"topic": "9. Avaliação da governança operacional", "items": [["9.1", "Verificar responsabilidades, níveis de decisão e rotinas de acompanhamento.", "Responsáveis por processos; quem pode decidir o quê; assuntos que precisam ser escalados; frequência de acompanhamento; dúvidas ou sobreposições percebidas."], ["9.2", "Avaliar reuniões operacionais e práticas de gestão visual.", "Tipo de reunião; frequência; duração; participantes; indicadores tratados; quadro/gestão visual existente; planos de ação; evidências de acompanhamento."], ["9.3", "Analisar o tratamento dado aos desvios e problemas recorrentes.", "Problema selecionado; quando ocorreu; frequência; como foi tratado; responsável; ação adotada; situação atual; se voltou a ocorrer."], ["9.4", "Verificar a governança dos processos logísticos.", "Quem acompanha cada processo; mecanismos de controle; escalonamento; comunicação entre áreas; fóruns de decisão; lacunas percebidas."], ["9.5", "Avaliar a sustentabilidade das melhorias implantadas.", "Melhoria anteriormente implantada; data aproximada; situação atual; ainda funciona ou não; controle existente; responsável; motivo de perda da melhoria, se ocorreu."]]}, {"topic": "10. Avaliação de desempenho e resultados", "items": [["10.1", "Identificar as principais causas de custos operacionais e retrabalhos.", "Ocorrência; processo; tipo de retrabalho/custo percebido; frequência informada; pessoas/equipamentos envolvidos; causa aparente; dado financeiro disponível ou pendente."], ["10.2", "Avaliar os impactos dos problemas no nível de serviço ao cliente.", "Problema operacional; impacto relatado no pedido/cliente; atrasos, erros ou indisponibilidade associados; exemplos existentes; indicador/documento a solicitar posteriormente."], ["10.3", "Levantar perdas de produtividade e capacidade.", "Processo; tipo de perda; tempo parado; quantidade de pessoas/equipamentos afetados; capacidade percebida; volume não produzido/processado, quando mensurável; amostras realizadas."], ["10.4", "Identificar oportunidades para aumentar a acuracidade dos estoques.", "Problema encontrado; processo relacionado; causa percebida; oportunidade sugerida; área responsável; evidência que sustenta a oportunidade."], ["10.5", "Estimar os principais ganhos potenciais do projeto.", "Registrar somente a base para a estimativa: problema, quantidade/frequência, tempo perdido, volume afetado, pessoas envolvidas, custos disponíveis e potenciais benefícios. A estimativa financeira deve ser feita depois da análise."]]}];
const KEY = 'cajamar_registro_campo_v1';
let state = JSON.parse(localStorage.getItem(KEY) || '{}');

function esc(s) {
  return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function render() {
  const nav = document.getElementById('nav');
  const topics = document.getElementById('topics');
  nav.innerHTML = '';
  topics.innerHTML = '';

  DATA.forEach((t, ti) => {
    const btn = document.createElement('button');
    btn.className = 'navbtn' + (ti===0?' active':'');
    btn.innerHTML = esc(t.topic) + `<small>${t.items.length} subtópicos</small>`;
    btn.onclick = () => showTopic(ti);
    nav.appendChild(btn);

    const sec = document.createElement('section');
    sec.className = 'topic' + (ti===0?' active':'');
    sec.dataset.topic = ti;
    sec.innerHTML = `
      <div class="topic-head">
        <h2>${esc(t.topic)}</h2>
        <p>Registre apenas o que foi observado, informado ou medido. O que depender de análise posterior fica como pendência.</p>
      </div>
    `;

    t.items.forEach(([id, req, guide]) => {
      const s = state[id] || {};
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-head" onclick="this.parentElement.classList.toggle('open')">
          <div class="idpill">${id}</div>
          <div class="card-title">${esc(req)}</div>
          <div class="status-dot" id="dot-${id}"></div>
        </div>
        <div class="card-body">
          <div class="guide">
            <b>O que registrar no local</b>
            <p>${esc(guide)}</p>
          </div>
          <div class="grid">
            <div class="field">
              <label>Status da coleta</label>
              <select data-id="${id}" data-field="status" onchange="changeField(this)">
                ${['Não iniciado','Em coleta','Coleta concluída','Aguardando informação','Não se aplica'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label>Área / processo</label>
              <input data-id="${id}" data-field="area" value="${esc(s.area||'')}" oninput="changeField(this)" placeholder="Ex.: Picking / Rua A / Recebimento">
            </div>
            <div class="field full">
              <label>Registro de campo</label>
              <textarea data-id="${id}" data-field="registro" oninput="changeField(this)" placeholder="Descreva objetivamente o que foi observado...">${esc(s.registro||'')}</textarea>
            </div>
            <div class="field">
              <label>Fonte / pessoa consultada</label>
              <input data-id="${id}" data-field="fonte" value="${esc(s.fonte||'')}" oninput="changeField(this)" placeholder="Nome, função ou área">
            </div>
            <div class="field">
              <label>Evidência / referência</label>
              <input data-id="${id}" data-field="evidencia" value="${esc(s.evidencia||'')}" oninput="changeField(this)" placeholder="Foto 03, tela WMS, POP 02...">
            </div>
            <div class="field full">
              <label>Pendência para análise posterior</label>
              <textarea data-id="${id}" data-field="pendencia" oninput="changeField(this)" placeholder="Ex.: solicitar relatório SAP x WMS, validar com TI...">${esc(s.pendencia||'')}</textarea>
            </div>
          </div>
          <div class="item-footer">
            <span>Salvamento automático no navegador</span>
            <span class="saved" id="saved-${id}"></span>
          </div>
          <div class="note">Dica: se houver mais de uma ocorrência para o mesmo requisito, registre cada caso em linhas separadas no campo “Registro de campo”.</div>
        </div>`;
      sec.appendChild(card);
    });
    topics.appendChild(sec);
  });
  updateProgress();
}

function showTopic(i) {
  document.querySelectorAll('.topic').forEach((x,idx)=>x.classList.toggle('active', idx===i));
  document.querySelectorAll('.navbtn').forEach((x,idx)=>x.classList.toggle('active', idx===i));
  window.scrollTo({top:0,behavior:'smooth'});
}

function changeField(el) {
  const id = el.dataset.id;
  const field = el.dataset.field;
  state[id] = state[id] || {};
  state[id][field] = el.value;
  localStorage.setItem(KEY, JSON.stringify(state));
  const saved = document.getElementById('saved-'+id);
  if(saved) {
    saved.textContent='Salvo ✓';
    setTimeout(()=>saved.textContent='',1200);
  }
  updateProgress();
}

function updateProgress() {
  const all = DATA.flatMap(t=>t.items);
  let done = 0;
  all.forEach(([id])=>{
    const st = (state[id]||{}).status || 'Não iniciado';
    if(st==='Coleta concluída' || st==='Não se aplica') done++;
    const dot = document.getElementById('dot-'+id);
    if(dot) {
      dot.style.background = st==='Coleta concluída' ? '#2E7D32' :
                             st==='Aguardando informação' ? '#F4C542' :
                             st==='Em coleta' ? '#2F6B9A' :
                             st==='Não se aplica' ? '#98A2B3' : '#CBD5E1';
    }
  });
  document.getElementById('progText').textContent = `${done}/${all.length}`;
  document.getElementById('progBar').style.width = `${(done/all.length)*100}%`;
}

function salvarTudo() {
  localStorage.setItem(KEY, JSON.stringify(state));
  alert('Coleta salva neste navegador.');
}

function exportarJSON() {
  const payload = {
    projeto:'Diagnóstico CD Cajamar',
    exportadoEm:new Date().toISOString(),
    respostas:state
  };
  const blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'coleta_cd_cajamar.json';
  a.click();
